apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: mypostgresql
  name: mypostgresql
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: mypostgresql
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: mypostgresql
    spec:
      containers:
      - image: postgres
        imagePullPolicy: Always
        name: postgres
        resources:
          limits:
            ephemeral-storage: 1Gi
          requests:
            cpu: 500m
            ephemeral-storage: 1Gi
            memory: 2Gi
        volumeMounts:
        - mountPath: /var/lib/postgresql
          name: pgdata
        env:
        - name: POSTGRES_PASSWORD
          value: "mypassword"
      volumes:
      - name: pgdata
        persistentVolumeClaim:
          claimName: pgdata-claim
      restartPolicy: Always